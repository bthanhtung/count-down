<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Đếm ngược Tết</title>
  <meta name="description" content="Đếm ngược đến Tết Nguyên Đán và Tết Dương lịch theo giờ Việt Nam. Hoa mai rơi, pháo hoa và lời chúc đầu năm.">
  <meta name="theme-color" content="#2a0508">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://saptet.tungdadev.com/">
  <meta property="og:title" content="Sắp Tết rồi! Còn bao nhiêu ngày nữa?">
  <meta property="og:description" content="Đếm ngược từng giây đến Tết Đinh Mùi 2027 theo giờ Việt Nam — hoa mai rơi, pháo hoa và lời chúc đầu năm.">
  <meta property="og:image" content="https://saptet.tungdadev.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="vi_VN">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,500;0,700;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="petals" aria-hidden="true"></canvas>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>

  <svg class="lantern l1" viewBox="0 0 80 160" aria-hidden="true"><use href="#lantern"/></svg>
  <svg class="lantern l2" viewBox="0 0 80 160" aria-hidden="true"><use href="#lantern"/></svg>
  <svg class="lantern l3" viewBox="0 0 80 160" aria-hidden="true"><use href="#lantern"/></svg>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <radialGradient id="lg" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ff6a4d"/><stop offset=".6" stop-color="#d81e1e"/><stop offset="1" stop-color="#8f0b10"/></radialGradient>
      <symbol id="lantern" viewBox="0 0 80 160">
        <line x1="40" y1="0" x2="40" y2="34" stroke="#e8b04b" stroke-width="2"/>
        <rect x="26" y="32" width="28" height="8" rx="2" fill="#e8b04b"/>
        <ellipse cx="40" cy="78" rx="34" ry="40" fill="url(#lg)"/>
        <path d="M40 38 Q16 78 40 118 M40 38 Q64 78 40 118 M40 38 V118" stroke="#ffb199" stroke-opacity=".35" stroke-width="1.5" fill="none"/>
        <rect x="26" y="116" width="28" height="8" rx="2" fill="#e8b04b"/>
        <path d="M32 124 v26 M36 124 v30 M40 124 v34 M44 124 v30 M48 124 v26" stroke="#e8b04b" stroke-width="1.6"/>
      </symbol>
    </defs>
  </svg>

  <main class="wrap">
    <div class="switch" role="tablist" aria-label="Chọn mốc đếm ngược">
      <button role="tab" aria-selected="true" data-mode="tet">Tết Nguyên Đán</button>
      <button role="tab" aria-selected="false" data-mode="duong">Tết Dương lịch</button>
      <span class="thumb" aria-hidden="true"></span>
    </div>

    <p class="kicker" id="kicker">Còn lại đến</p>
    <h1 class="title" id="title">Tết</h1>
    <p class="date" id="date"></p>

    <div class="clock" id="clock" aria-live="off">
      <div class="unit"><div class="num" data-u="d"></div><span>Ngày</span></div>
      <div class="unit"><div class="num" data-u="h"></div><span>Giờ</span></div>
      <div class="unit"><div class="num" data-u="m"></div><span>Phút</span></div>
      <div class="unit"><div class="num" data-u="s"></div><span>Giây</span></div>
    </div>
    <p class="sr" id="sr" aria-live="polite"></p>

    <div class="progress" aria-hidden="true">
      <div class="bar"><i id="bar"></i></div>
      <p id="progress-text"></p>
    </div>

    <p class="wish" id="wish"></p>

    <div class="actions">
      <button class="btn gold" id="fire-btn">
        <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
        Bắn pháo hoa
      </button>
      <button class="btn ghost" id="share-btn">
        <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v14"/></svg>
        Gửi cho bạn bè
      </button>
    </div>
  </main>

  <footer class="foot">Giờ Việt Nam (GMT+7) · làm bởi <a href="https://www.tungdadev.com/">TungDaDev</a></footer>
  <div class="sheet-scrim" id="sheet-scrim"></div>
  <section class="sheet" id="share-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
    <div class="sheet-head">
      <h2 id="sheet-title">Gửi cho bạn bè</h2>
      <button class="sheet-x" id="sheet-close" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <p class="sheet-preview" id="share-preview"></p>
    <div class="sheet-grid">
      <button data-share="facebook"><i style="background:#1877F2"><svg class="brand" viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v9h4v-9h3l.5-4h-3.5V8.9c0-.6.4-.9 1-.9z"/></svg></i>Facebook</button>
      <button data-share="messenger"><i style="background:linear-gradient(45deg,#0099FF,#A033FF 60%,#FF5280)"><svg class="brand" viewBox="0 0 24 24"><path d="M12 2C6.4 2 2 6.1 2 11.6c0 2.9 1.2 5.4 3.2 7.1V22l2.9-1.6c1.2.3 2.5.5 3.9.5 5.6 0 10-4.1 10-9.4S17.6 2 12 2zm1 12.6l-2.5-2.7-5 2.7 5.5-5.8 2.6 2.7 4.9-2.7-5.5 5.8z"/></svg></i>Messenger</button>
      <button data-share="zalo"><i style="background:#0068FF"><b class="zalo">Zalo</b></i>Zalo</button>
      <button data-share="telegram"><i style="background:#26A5E4"><svg class="brand" viewBox="0 0 24 24"><path d="M21.6 4.2L2.9 11.4c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.4l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.3-1.5zM9.3 14.4l9-5.7c.4-.3.8-.1.5.2l-7.7 7-.3 3.2-1.5-4.7z"/></svg></i>Telegram</button>
      <button data-share="x"><i style="background:#000"><svg class="brand" viewBox="0 0 24 24"><path d="M17.8 3H21l-7 8 8.2 10h-6.4l-5-6.2L5.1 21H2l7.5-8.6L1.6 3h6.6l4.5 5.7L17.8 3zm-1.1 16.2h1.8L7.2 4.7H5.3l11.4 14.5z"/></svg></i>X</button>
      <button data-share="copy"><i style="background:linear-gradient(180deg,#fff1c7,#f3c867)"><svg viewBox="0 0 24 24" style="color:#3a0a06"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></i>Chép link</button>
      <button data-share="more"><i style="background:rgba(255,220,170,.14)"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></i>Khác…</button>
    </div>
  </section>
  <div class="toast" id="toast" role="status"></div>
  <script src="fireworks.js"></script>
  <script src="app.js"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "121ebc605e974a3b8ce880a5c7136b65"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
